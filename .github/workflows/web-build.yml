name: Godot Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Parse project
        run: godot --headless --path . --editor --quit

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: marchbound-web
          path: build/web
