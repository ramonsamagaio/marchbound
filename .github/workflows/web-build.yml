name: Godot Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/marchbound-parse.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to (load script|create an autoload|instantiate an autoload)' /tmp/marchbound-parse.log; then
            echo '::error::Godot reported script errors during project parsing.'
            exit 1
          fi

      - name: Smoke run main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 4 2>&1 | tee /tmp/marchbound-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to (load script|create an autoload|instantiate an autoload)' /tmp/marchbound-smoke.log; then
            echo '::error::Godot reported script/runtime errors during the smoke run.'
            exit 1
          fi

      - name: Smoke retention ecosystem
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/RetentionSmoke.tscn 2>&1 | tee /tmp/marchbound-retention.log
          if grep -Eq 'SCRIPT ERROR:|RETENTION_SMOKE_FAIL|ERROR: Failed to (load script|create an autoload|instantiate an autoload)' /tmp/marchbound-retention.log; then
            echo '::error::Retention ecosystem smoke reported runtime errors.'
            exit 1
          fi
          grep -q 'RETENTION_SMOKE_OK' /tmp/marchbound-retention.log

      - name: Smoke frontier discovery ecosystem
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/FrontierSmoke.tscn 2>&1 | tee /tmp/marchbound-frontier.log
          if grep -Eq 'SCRIPT ERROR:|FRONTIER_SMOKE_FAIL|ERROR: Failed to (load script|create an autoload|instantiate an autoload)' /tmp/marchbound-frontier.log; then
            echo '::error::Frontier discovery ecosystem smoke reported runtime errors.'
            exit 1
          fi
          grep -q 'FRONTIER_SMOKE_OK' /tmp/marchbound-frontier.log

      - name: Export Web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/marchbound-export.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to (load script|create an autoload|instantiate an autoload)|ERROR:.*export' /tmp/marchbound-export.log; then
            echo '::error::Godot reported errors during the Web export.'
            exit 1
          fi
          test -s build/web/index.html

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: marchbound-web
          path: build/web
