name: Publish Marchbound Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marchbound-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/marchbound-pages-parse.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to (load script|create an autoload|instantiate an autoload)' /tmp/marchbound-pages-parse.log; then
            echo '::error::Godot reported script errors during project parsing.'
            exit 1
          fi

      - name: Smoke run main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 4 2>&1 | tee /tmp/marchbound-pages-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to (load script|create an autoload|instantiate an autoload)' /tmp/marchbound-pages-smoke.log; then
            echo '::error::Godot reported script/runtime errors during the smoke run.'
            exit 1
          fi

      - name: Export Web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/marchbound-pages-export.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to (load script|create an autoload|instantiate an autoload)|ERROR:.*export' /tmp/marchbound-pages-export.log; then
            echo '::error::Godot reported errors during the Web export.'
            exit 1
          fi
          test -s build/web/index.html
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
