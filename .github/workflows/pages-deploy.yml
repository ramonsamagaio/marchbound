name: Publish Marchbound Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marchbound-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Parse project
        run: godot --headless --path . --editor --quit

      - name: Smoke run main scene
        run: godot --headless --path . --quit-after 4

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
